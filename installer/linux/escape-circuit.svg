<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Icono de Circuito de Escape: laberinto, jugador, interruptores y salida. -->
  <rect x="4" y="4" width="120" height="120" rx="22" fill="#1f2937"/>
  <g fill="#6b7280">
    <rect x="20" y="20" width="88" height="8" rx="2"/>
    <rect x="20" y="100" width="88" height="8" rx="2"/>
    <rect x="20" y="20" width="8" height="88" rx="2"/>
    <rect x="100" y="20" width="8" height="56" rx="2"/>
    <rect x="44" y="44" width="40" height="8" rx="2"/>
    <rect x="44" y="44" width="8" height="40" rx="2"/>
    <rect x="68" y="68" width="8" height="40" rx="2"/>
  </g>
  <!-- salida -->
  <rect x="98" y="80" width="12" height="20" rx="2" fill="#22c55e"/>
  <!-- interruptores A y B -->
  <circle cx="88" cy="36" r="6" fill="#facc15"/>
  <circle cx="36" cy="92" r="6" fill="#facc15"/>
  <!-- vigilante -->
  <path d="M60 58 l8 8 -8 8 -8 -8 z" fill="#ef4444"/>
  <!-- jugador -->
  <circle cx="36" cy="36" r="8" fill="#38bdf8"/>
</svg>
